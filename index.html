<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="SPIDER-MAN - SITIO OFICIAL. SPIDER-MAN: BRAND NEW DAY: LA NUEVA PELÍCULA, YA EN CINES">
        <title>Spider-Man - Tom Holland</title>
        <link rel="icon" href="images/icono spiderman.svg">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="cuerpo-sitio">
        <header class="encabezado-principal">
            <div class="contenedor-navegacion">
                <div class="logo-encabezado">
                    <img src="images/icono_spiderman.svg" alt="Logo Spider-Man" class="imagen-logo">
                </div>
                <nav class="menu-navegacion">
                    <a href="index.html" class="enlace-menu">Inicio</a>
                    <a href="peliculas.html" class="enlace-menu">Películas</a>
                    <a href="personajes.html" class="enlace-menu">Personajes</a>
                    <a href="escenas.html" class="enlace-menu">Escenas</a>
                    <a href="quizzes.html" class="enlace-menu">Quizzes</a>
                    <a href="galeria.html" class="enlace-menu">Galería</a>
                    <a href="contacto.html" class="enlace-menu">Contacto</a>
                </nav>
                <div class="iconos-usuario">
                    <span class="material-symbols-outlined icono-rojo">search</span>
                    <span class="material-symbols-outlined icono-rojo">person</span>
                </div>
            </div>
        </header>
        
        <main class="contenido-principal">
            
            <!-- SECCIÓN HERO -->
            <section class="seccion-portada-hero">
                <img src="images/texto_spiderman_home.png" alt="Título del página web" class="titulo-fondo-spiderman">
                <div class="contenedor-imagen-principal">
                    <img src="images/foto_principal_home.png" alt="Spider-Man" class="imagen-heroe-centro">
                </div>
                <!-- Elementos superpuestos al héroe -->
                <div class="elementos-flotantes-portada">
                    <img src="images/sticker_hello_my_name_is.png" alt="Sticker Hello my name is Spider-Man" class="sticker-presentacion">
                    <img src="images/sticker_cara_spiderman.png" alt="Cara Spider-Man" class="icono-cara-pequena">
                    <h2 class="subtitulo-portada">Tu amigo<br>y vecino</h2>
                </div>
            </section>

            <!-- SECCIÓN PELÍCULAS -->
            <section class="seccion-tarjetas-peliculas">
                <div class="contenedor-grilla-peliculas">
                    <article class="tarjeta-individual-pelicula">
                        <img src="images/arana_homecoming.svg" alt="Spider-Man Homecoming" class="imagen-logo-pelicula">
                        <img src="images/logo_homecoming.png" alt="Spider-Man Homecoming" class="imagen-logo-pelicula">
                        <button class="boton-azul-accion">Ver más</button>
                    </article>
                    <article class="tarjeta-individual-pelicula">
                        <img src="images/arana_far_from_home.svg" alt="Spider-Man Far From Home" class="imagen-logo-pelicula">
                        <img src="images/logo_far_from_home.png" alt="Spider-Man Homecoming" class="imagen-logo-pelicula">
                        <button class="boton-azul-accion">Ver más</button>
                    </article>
                    <article class="tarjeta-individual-pelicula">
                        <img src="images/arana_no_way_home.svg" alt="Spider-Man No Way Home" class="imagen-logo-pelicula">
                        <img src="images/logo_no_way_home.png" alt="Spider-Man Homecoming" class="imagen-logo-pelicula">
                        <button class="boton-azul-accion">Ver más</button>
                    </article>
                    <article class="tarjeta-individual-pelicula">
                        <img src="images/arana_brand_new_day.svg" alt="Spider-Man Brand New Day" class="imagen-logo-pelicula">
                        <img src="images/logo_brand_new_day.png" alt="Spider-Man Homecoming" class="imagen-logo-pelicula">
                        <button class="boton-azul-accion">Ver más</button>
                    </article>
                </div>
            </section>

            <!-- SECCIÓN PERSONAJES (COLLAGE) -->
            <section class="seccion-explorar-personajes">
                <div class="columna-botones-personajes">
                    <h2 class="titulo-seccion">Personajes</h2>
                    <button class="boton-rojo-ancho">Principales</button>
                    <button class="boton-rojo-ancho">Villanos</button>
                </div>
                <div class="columna-collage-imagenes">
                    <img src="images/web_fluid_hoja.png" alt="Apuntes Web Fluid" class="imagen-collage-libreta">
                    <img src="images/daily_bugle_mysterio.png" alt="Daily Bugle" class="imagen-collage-diario diario-1">
                    <img src="images/daily bugle vulture.png" alt="Daily Bugle" class="imagen-collage-diario diario-2">
                    <img src="images/polaroid.png" alt="Polaroid Peter y MJ" class="imagen-collage-polaroid">
                    <img src="images/thwip.png" alt="Thwip" class="imagen-collage-thwip">
                </div>
            </section>

            <!-- SECCIÓN CARRUSEL -->
            <section class="seccion-carrusel-momentos">
                <h2 class="titulo-seccion alineado-derecha">Mejores momentos</h2>    
                <div class="contenedor-deslizador-momentos">
                    <button id="boton-anterior-momento" class="boton-flecha-carrusel">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    
                    <div class="pista-tarjetas-momentos" id="pista-carrusel">
                        <article class="tarjeta-momento-destacado">
                            <img src="images/rescate_del_ferry.png" alt="Rescate del ferry" class="imagen-escena-momento">
                            <button class="boton-azul-accion">Rescate del ferry</button>
                        </article>
                        
                        <!-- Clase tarjeta-activa agregada acá -->
                        <article class="tarjeta-momento-destacado tarjeta-activa">
                            <img src="images/spidey_vs_mysterio.png" alt="Spidey VS Mysterio" class="imagen-escena-momento">
                            <button class="boton-azul-accion">Spidey VS Mysterio</button>
                        </article>
                        
                        <article class="tarjeta-momento-destacado">
                            <img src="images/choque_de_universos.png" alt="Choque de universos" class="imagen-escena-momento">
                            <button class="boton-azul-accion">Choque de universos</button>
                        </article>
                    </div>
                    
                    <button id="boton-siguiente-momento" class="boton-flecha-carrusel">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </section>

            <!-- SECCIÓN QUIZ -->
            <section class="seccion-juego-quiz">
                <!-- Decoraciones absolutas -->
                <img src="images/dibujo_spider_sense.png" alt="Máscara Spider-Man" class="decoracion-fondo-mascara">
                <img src="images/sticker_mano_thwip.png" alt="Mano lanzando telaraña" class="decoracion-fondo-mano">
                
                <div class="contenedor-texto-quiz">
                    <h2 class="titulo-seccion centrado">¿Qué tanto sabés de<br>Spider-Man?</h2>
                    <p class="parrafo-descripcion-quiz">Probá el test y poné a prueba tus conocimientos</p>
                    <button class="boton-rojo-jugar">Jugar</button>
                </div>
                
                <div class="contenedor-diarios-fondo">
                    <img src="images/daily bugle vigilante.png" alt="Periódicos de fondo" class="imagen-diarios-inferiores">
                    <img src="images/daily_bugle_enough.png" alt="Periódicos de fondo" class="imagen-diarios-inferiores">
                    <img src="images/daily bugle super zero.png" alt="Periódicos de fondo" class="imagen-diarios-inferiores">
                </div>
            </section>
        </main>
        
        <footer class="pie-de-pagina-sitio">
            <div class="contenedor-navegacion-footer">
                <img src="images/arana_brand_new_day.svg" alt="Logo Spider-Man" class="imagen-logo-footer">
                <nav class="menu-navegacion-footer">
                    <a href="index.html" class="enlace-menu-footer">Inicio</a>
                    <a href="peliculas.html" class="enlace-menu-footer">Películas</a>
                    <a href="personajes.html" class="enlace-menu-footer">Personajes</a>
                    <a href="escenas.html" class="enlace-menu-footer">Escenas</a>
                    <a href="quizzes.html" class="enlace-menu-footer">Quizzes</a>
                    <a href="galeria.html" class="enlace-menu-footer">Galería</a>
                    <a href="contacto.html" class="enlace-menu-footer">Contacto</a>
                </nav>
            </div>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
